[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lafractale-studio"
version = "0.2.0b2"
description = "Deterministic bilingual children's activity book demo engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "reportlab>=4,<5", "PyMuPDF>=1.24,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lafractale = "lafractale.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
