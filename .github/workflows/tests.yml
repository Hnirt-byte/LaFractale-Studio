name: LaFractale Studio CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m lafractale validate books/halloween_2026/book.yaml
      - run: python -m lafractale validate books/christmas_2026/book.yaml
      - run: python -m lafractale build-demo books/halloween_2026/book.yaml --out dist/ci-halloween
      - run: python -m lafractale qa dist/ci-halloween --book books/halloween_2026/book.yaml
      - run: python -m lafractale build-demo books/christmas_2026/book.yaml --out dist/ci-christmas
      - run: python -m lafractale qa dist/ci-christmas --book books/christmas_2026/book.yaml
